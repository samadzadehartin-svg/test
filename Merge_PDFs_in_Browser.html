<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>ادغام PDFها</title><style>body{max-width:700px;margin:50px auto;font:17px Tahoma;line-height:2}button{padding:12px;background:#156fa9;color:white;border:0;border-radius:6px}</style><h1>ادغام PDFها در مرورگر</h1><p>PDFها روی دستگاه شما پردازش می‌شوند. برای کتابخانه pdf-lib اتصال اینترنت لازم است. برای آثار اشتراکی، شرایط نگهداری و اشتراک‌گذاری دانشگاه را رعایت کنید.</p><input id="f" type="file" multiple accept=".pdf,application/pdf"><button id="merge">ادغام و ذخیره</button><p id="msg"></p><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>document.getElementById("merge").onclick=async()=>{const msg=document.getElementById("msg");try{if(!window.PDFLib)throw Error("pdf-lib بارگذاری نشد؛ از اینترنت شخصی استفاده کنید");const files=[...document.getElementById("f").files];if(!files.length)throw Error("PDF انتخاب نشده");const out=await PDFLib.PDFDocument.create();for(const file of files){const pdf=await PDFLib.PDFDocument.load(await file.arrayBuffer());const pages=await out.copyPages(pdf,pdf.getPageIndices());for(const p of pages)out.addPage(p);msg.textContent=file.name+" اضافه شد";}const data=await out.save();const u=URL.createObjectURL(new Blob([data],{type:"application/pdf"}));const a=document.createElement("a");a.href=u;a.download="Articles_All_Merged.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);msg.textContent="ادغام "+files.length+" فایل پایان یافت";}catch(e){msg.textContent="خطا: "+e.message}};</script></html>
