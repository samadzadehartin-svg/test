":"اطالعات جزوه اکیف نیست","source_page":160},{"uid":"c7q383","chapter":7,"number":383,"year":"1401","code":"X14-T14","topic":"داروهای ضدویروس :هپاتیت C","text":"کدامیک از داروهای ضد ویروسی زیر در ترکیب با اینترفرون آلفا در درمان هپاتیت Cموثر است؟","options":["Sofosbuvir","Adefovir","Ribavirin","Telaprevir"],"correct":null,"explanation":"اطالع ات ج زوه ب رای پاس خ قطعی ک افی نیس ت .ج زوه سوفوس بوویر و تالپروی ر را داروی HCVو ریب اویرین را داروی وس یع‌الطیف ️⚠ (مثال )CCHFمی‌آورد ،ولی درمان ترکیبی با اینترفرون آلفا را برای هیچ‌کدام ذکر نکرده است. یادداشت :کلید فایل :ج.","status":"اطالعات جزوه اکیف نیست","source_page":160},{"uid":"c7q384","chapter":7,"number":384,"year":"1388","code":"X02-T02","topic":"آنیت‌سپتیک‌ها :لکرهگزیدین","text":"تمامی گزینه‌های زیر در مورد کلروهگزیدین صحیح است بجز:","options":["اثر ضد میکروبی سریع‌تر نسبت به الکل","عدم تاثیر مواد آلی و pHبر کارایی آن","وسیع‌الطیف","جزء ترکیبات فنولیک بوده و پایداری اندک دارد"],"correct":null,"explanation":"اطالعات جزوه برای پاسخ قطعی کافی نیست .جزوه درباره کلرهگزیدین فقط می‌گوی د ب ا س رعتی بس یار کم تر از الک ل میک روب را ️⚠ می‌کشد و pHباال کارایی آن را کم می‌کند .پس گزینه الف (سریع‌تر از الکل) و ب (عدم تأثیر )pHهر دو با جزوه نادرست‌اند و ج زوه درباره فنولی بودن یا طیف آن چیزی نمی‌گوید. یادداشت :سؤال «بجز» است ولی طبق جزوه بیش از یک گزینه نادرست است.","status":"اطالعات جزوه اکیف نیست","source_page":160},{"uid":"c7q385","chapter":7,"number":385,"year":"1386","code":"X07-T49","topic":"ماکنیسم مواد شیمیایی","text":"همه عبارت‌های زیر صحیح است ـ بجز:","options":["مدت زمان ،دما ،و pHدر اثرگذاری مواد ضدعفونی‌کننده ،مثل تنتور ید ،موثر می‌باشد","فرمالین ( )Formaldehydeبا اکسیده کردن پروتئین‌ها ،میکروب‌های بیماریزا را خنثی می‌نماید","مواد ضدعفونی‌کننده‌ای که ویروس‌ها را می‌کشند ،وایروسایدال Virocidalمی‌نامند","مواد آمونیاکی 4ظرفیتی برای حذف اندوسپورها و میکروارگانیسم‌های سل توصیه می‌شود"],"correct":null,"explanation":"اطالعات جزوه برای پاس خ قطعی ک افی نیس ت .طب ق ج زوه چن د گزین ه نادرس ت اس ت :غلظت و pHروی فع الیت ی د <script>
'use strict';
const CHAPTERS=[{id:1,name:'تاریخچه، طبقه‌بندی، ساختار و ویژگی‌های میکروارگانیسم‌ها',start:5,end:31},{id:2,name:'متابولیسم و ژنتیک باکتری‌ها',start:32,end:52},{id:3,name:'عوامل ضدمیکروبی (۱): آنتی‌بیوتیک‌ها',start:53,end:76},{id:4,name:'مکانیسم‌های بیماری‌زایی میکروبی و میکروبیوم انسانی',start:77,end:92},{id:5,name:'مقاومت آنتی‌بیوتیکی، داروهای ضدویروسی و واکسن',start:93,end:106},{id:6,name:'واکسن‌های ویروسی؛ استریلیزاسیون، ضدعفونی و آنتی‌سپسیس',start:107,end:128},{id:7,name:'سؤال‌های خارج از جزوه / بدون پاسخ قطعی',start:129,end:180}];
const LETTERS=['الف','ب','ج','د','ه','و'];
const $=s=>document.querySelector(s), h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s??'').replace(/[\u06f0-\u06f9]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[\u0660-\u0669]/g,c=>String(c.charCodeAt(0)-1632));
const enfa=n=>Number(n||0).toLocaleString('fa-IR');
const clean=s=>digits(String(s??'').replace(/[\u202a-\u202e\u2066-\u2069\u200e\u200f\u061c\u00ad]/g,'').replace(/\u200c/g,'‌').replace(/[ \t]+/g,' ').replace(/\n[ \t]+/g,'\n').replace(/\n{3,}/g,'\n\n').trim());
const loadStore=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};
let bank=loadStore('micro_bank_v3',[]); try{let embedded=JSON.parse($('#embedded-bank').textContent);if(Array.isArray(embedded)&&embedded.length>bank.length)bank=embedded}catch{}
let records=loadStore('micro_records_v3',{}), view={type:'home',ch:0,topic:'',index:0,query:'',onlyWrong:false};
function store(){try{localStorage.setItem('micro_bank_v3',JSON.stringify(bank));localStorage.setItem('micro_records_v3',JSON.stringify(records))}catch(e){toast('حافظه مرورگر پر شده؛ برای حفظ نسخه پشتیبان از خروجی گزارش استفاده کن.','warn')}}
function toast(msg,type='good'){const t=$('#toast');t.className='notice '+type;t.textContent=msg;setTimeout(()=>{t.className='notice hidden'},6500)}
function groupKey(q){return `${q.chapter}§${q.topic||'عمومی'}`}
function getQs(ch,topic=''){return bank.filter(q=>q.chapter===ch&&(!topic||q.topic===topic))}
function typeOf(q){return q.options?.length>=2?'mcq':'short'}
function normalizedLetter(c){let x=String(c||'').trim();return LETTERS.includes(x)?x:(/^([a-f]|[1-6])$/i.test(x)?LETTERS['abcdef'.indexOf(x.toLowerCase())>=0?'abcdef'.indexOf(x.toLowerCase()):(+x-1)]:null)}
function resultFor(q,rec){if(typeOf(q)==='short')return rec.self===true?'correct':rec.self===false?'wrong':'self';if(!q.correct||!q.options?.[LETTERS.indexOf(q.correct)])return 'ungraded';if(!rec.choice)return 'blank';return rec.choice===q.correct?'correct':'wrong'}
function isGradeable(q){return typeOf(q)==='mcq'&&q.correct&&q.options?.[LETTERS.indexOf(q.correct)]&&q.chapter!==7}
function summarize(qs,r={}){let answered=0,correct=0,wrong=0,missed=0,ungraded=0,manual=0;for(let q of qs){let rr=r[q.uid]||{},status=resultFor(q,rr);if(rr.choice||rr.text)answered++;if(status==='correct'){correct++;if(typeOf(q)==='short')manual++}else if(status==='wrong')wrong++;else if(status==='blank'&&isGradeable(q))missed++;else if(status==='ungraded'||status==='self')ungraded++}let graded=qs.filter(q=>isGradeable(q)).length;let autoCorrect=qs.filter(q=>isGradeable(q)&&resultFor(q,r[q.uid]||{})==='correct').length;return {answered,correct,wrong,missed,ungraded,manual,graded,autoCorrect,percent:graded?Math.round(autoCorrect/graded*100):null}}
function stats(){let allAns={};for(const v of Object.values(records)){if(v&&v.answers)Object.assign(allAns,v.answers)}let s=summarize(bank,allAns);$('#stats').innerHTML=[['کل سؤال‌ها',enfa(bank.length)],['سؤال‌های دارای پاسخ قابل‌تصحیح',enfa(bank.filter(isGradeable).length)],['پاسخ‌های ثبت‌شده',enfa(s.answered)],['مبحث‌های تکمیل‌شده',enfa(Object.keys(records).filter(k=>records[k]?.submitted).length)]].map(([k,v])=>`<div class="stat"><strong>${v}</strong><span>${k}</span></div>`).join('')}
function nav(){let el=$('#sideChapters');el.innerHTML=CHAPTERS.map(c=>{let qs=getQs(c.id);return `<button class="${view.ch===c.id&&view.type!=='home'?'active':''}" onclick="showChapter(${c.id})"><span>${h(c.name)}</span><span class="tag">${enfa(qs.length)}</span></button>`}).join('');$('#homeSide').classList.toggle('active',view.type==='home')}
function goto(type,ch=0,topic='',index=0){view={...view,type,ch,topic,index};nav();stats();$('#side').classList.remove('open')}
function header(k,title,sub){$('#bread').textContent=k;$('#pageTitle').textContent=title;$('#pageSub').textContent=sub}
function showHome(){goto('home');header('داشبورد آموزشی','آزمون هوشمند میکروب‌شناسی','فصل را انتخاب کن؛ می‌توانی هر مبحث را جداگانه آزمون بدهی.');let total=bank.length;let els=CHAPTERS.map(c=>{let qs=getQs(c.id),done=qs.filter(q=>records[q.uid]?.choice||records[q.uid]?.text).length;return `<button class="topic-tile" onclick="showChapter(${c.id})"><span><b>${enfa(c.id)}. ${h(c.name)}</b><small>${enfa(qs.length)} سؤال • ${enfa(done)} پاسخ ثبت‌شده</small><span class="mini-bar" style="display:block;width:180px;max-width:100%;margin-top:8px"><i style="width:${qs.length?Math.round(100*done/qs.length):0}%"></i></span></span><span>◀</span></button>`}).join('');$('#mainContent').innerHTML=(total?`<div class="notice ${total===385?'good':'warn'}"><b>${total===385?'بانک کامل بارگذاری شده':'بررسی کامل‌بودن استخراج ضروری است'}:</b> ${enfa(total)} سؤال از ۳۸۵ سؤال مورد انتظار بارگذاری شده است. برای هر مبحث، نتیجه و مرور خطا جداگانه ثبت می‌شود.</div>`:`<div class="notice warn">بانک سؤال هنوز به HTML افزوده نشده است. فایل PDF اصلی را با گزینه «افزودن PDF» انتخاب کن تا سؤال‌ها، کلیدها و توضیحات داخل این برنامه استخراج و ذخیره شوند. اگر نسخه تبدیل‌شده با اسکریپت پایتون را داشته باشی، همه سؤال‌ها از ابتدا موجودند.</div>`)+`<div class="section-title"><h3>فصل‌ها</h3></div><div class="grid2">${els}</div><div class="card"><h3>روش نمره‌دهی و مرور</h3><p class="muted">بعد از «ثبت و تصحیح آزمون» گزینه‌های صحیح و غلط، متن پاسخ تشریحی همان سؤال و یادداشت مرور نمایش داده می‌شود. امتیاز خودکار فقط از تست‌هایی محاسبه می‌شود که کلید معتبر دارند؛ سؤال‌های بدون پاسخ قطعی و پاسخ‌های تشریحی به‌اشتباه وارد نمره نمی‌شوند.</p><div class="flex"><button class="btn" onclick="showImport()">بارگذاری PDF</button><button class="btn" onclick="backup()">پشتیبان‌گیری از پیشرفت</button><button class="btn" onclick="document.getElementById('restore').click()">بازیابی پیشرفت</button><input type="file" id="restore" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)"></div></div>`}
function jsarg(s){return h(JSON.stringify(s)).replace(/`/g,'&#96;')}
function showChapter(ch){goto('chapter',ch);let c=CHAPTERS.find(c=>c.id===ch),qs=getQs(ch),topics=[...new Set(qs.map(q=>q.topic||'عمومی'))];header(`فصل ${enfa(ch)}`,c.name,`${enfa(qs.length)} سؤال در ${enfa(topics.length)} مبحث`);let cards=topics.map(t=>{let items=getQs(ch,t),p=items.filter(q=>records[q.uid]?.choice||records[q.uid]?.text).length,s=summarize(items,records);return `<button class="topic-tile" onclick="showQuiz(${ch},${jsarg(t)})"><span><b>${h(t)}</b><small>${enfa(items.length)} سؤال • ${enfa(p)} پاسخ‌داده‌شده ${s.percent!==null?' • '+enfa(s.percent)+'٪ بر پایه پاسخ‌های ذخیره‌شده':''}</small></span><span>◀</span></button>`}).join('');$('#mainContent').innerHTML=`<div class="notice ${ch===7?'warn':''}">${ch===7?'این فصل طبق فایل اصلی پاسخ قطعی ندارد؛ سؤال‌ها فقط برای تمرین و یادداشت‌برداری ارائه می‌شوند.':'سؤال‌ها به همان مبحث‌های درج‌شده در PDF تفکیک شده‌اند. هر مبحث را مستقل پاسخ بده.'}</div><div class="card"><div class="flex"><button class="btn primary" onclick="showQuiz(${ch},'')">شروع آزمون کل فصل (${enfa(qs.length)} سؤال)</button><button class="btn" onclick="showHome()">بازگشت به فصل‌ها</button></div></div><h3>فهرست مبحث‌ها</h3><div class="grid2">${cards||'<div class="empty">در این بخش سؤالی یافت نشد.</div>'}</div>`}
function recKey(){return `${view.ch}|${view.topic||'__all__'}`}
function recState(){let k=recKey();return records[k]??(records[k]={answers:{},submitted:false,at:0})}
function currentAnswers(){return recState().answers}
function showQuiz(ch,topic='',index=0,onlyWrong=false){goto('quiz',ch,topic,index);view.onlyWrong=onlyWrong;renderQuiz()}
function renderQuiz(){let c=CHAPTERS.find(c=>c.id===view.ch),all=getQs(view.ch,view.topic),st=recState(),answer=st.answers;let items=view.onlyWrong&&st.submitted?all.filter(q=>resultFor(q,answer[q.uid]||{})==='wrong'):all;view.index=Math.min(Math.max(view.index,0),Math.max(items.length-1,0));let q=items[view.index];let label=view.topic||'همه مبحث‌های فصل';header(`فصل ${enfa(view.ch)} / ${label}`,view.topic||c.name,`${enfa(items.length)} سؤال • امکان جابه‌جایی بین سؤال‌ها • ${st.submitted?'آزمون تصحیح شده':'آزمون در جریان'}`);let done=all.filter(q=>(answer[q.uid]?.choice||answer[q.uid]?.text)).length;let scores=st.submitted?summarize(all,answer):null;$('#mainContent').innerHTML=`<div class="card"><div class="flex" style="justify-content:space-between"><div><b>پیشرفت آزمون</b><div class="dash">${enfa(done)} از ${enfa(all.length)} پاسخ ثبت شده است</div></div><div class="flex"><button class="btn" onclick="showChapter(${view.ch})">مبحث‌ها</button>${st.submitted?`<button class="btn primary" onclick="showReport()">کارنامه ${scores.percent===null?'':enfa(scores.percent)+'٪'}</button>`:`<button class="btn primary" onclick="submitQuiz()">ثبت و تصحیح آزمون</button>`}</div></div><div class="progress" style="margin-top:13px"><i style="width:${all.length?100*done/all.length:0}%"></i></div>${st.submitted?`<div style="margin-top:14px" class="flex"><button class="btn ${view.onlyWrong?'primary':''}" onclick="view.onlyWrong=!view.onlyWrong;view.index=0;renderQuiz()">${view.onlyWrong?'نمایش همه سؤال‌ها':'فقط سؤال‌های غلط'}</button><button class="btn bad" onclick="restartQuiz()">تکرار آزمون</button></div>`:''}</div>${q?renderQuestion(q,st,view.index,items.length):`<div class="empty"><strong>${view.onlyWrong?'هیچ پاسخ غلطی ثبت نشده است.':'در این مبحث سؤالی پیدا نشد.'}</strong><button class="btn" onclick="view.onlyWrong=false;renderQuiz()">نمایش همه</button></div>`}${q?`<div class="card"><b>فهرست سؤال‌ها</b><div class="qnav">${items.map((x,i)=>{let rr=answer[x.uid]||{},status=st.submitted?resultFor(x,rr):(rr.choice||rr.text?'filled':'');return `<button class="${i===view.index?'current ':''}${status==='correct'?'good':status==='wrong'?'bad':status==='filled'?'filled':''}" onclick="view.index=${i};renderQuiz();window.scrollTo({top:0,behavior:'smooth'})" title="سؤال ${x.number}">${enfa(i+1)}</button>`}).join('')}</div></div>`:''}`}
function renderQuestion(q,st,i,len){let rec=st.answers[q.uid]||{},submitted=st.submitted,kind=typeOf(q),result=submitted?resultFor(q,rec):'',hasKey=isGradeable(q),html=`<div class="card question" id="qcard"><div class="qmeta"><span class="badge">سؤال ${enfa(q.number)} • ${enfa(i+1)} از ${enfa(len)}</span><span class="badge">${h(q.year||'سال نامشخص')}</span><span class="badge">${kind==='mcq'?'چهارگزینه‌ای':'کوتاه‌پاسخ'}</span>${q.code?`<span class="badge" dir="ltr">${h(q.code)}</span>`:''}${submitted?`<span class="badge ${result==='correct'?'correct':result==='wrong'?'wrong':'neutral'}">${result==='correct'?'✓ درست':result==='wrong'?'✕ نادرست':result==='blank'?'بدون پاسخ':result==='self'?'خودارزیابی نشده':'فاقد کلید قطعی'}</span>`:''}</div><div class="qtitle">${h(q.text||'متن سؤال در استخراج یافت نشد')}</div>`;
if(kind==='mcq'){html+=`<div class="options">`+q.options.map((opt,j)=>{let lettr=LETTERS[j],sel=rec.choice===lettr,isc=hasKey&&q.correct===lettr;return `<label class="option ${sel?'selected ':''}${submitted&&isc?'correct':''} ${submitted&&sel&&!isc&&hasKey?'wrong':''}"><input type="radio" name="qchoice" value="${lettr}" ${sel?'checked':''} ${submitted?'disabled':''} onchange="setChoice('${q.uid}','${lettr}')"><span><b>${lettr})</b> ${h(opt)}</span></label>`}).join('')+`</div>`}else{html+=`<div class="answerArea"><p class="muted">پاسخ تشریحی خودت را بنویس؛ بعد از ثبت آزمون با متن جزوه مقایسه کن.</p><textarea ${submitted?'disabled':''} oninput="setText('${q.uid}',this.value)" placeholder="پاسخ خود را بنویس...">${h(rec.text||'')}</textarea></div>`}
if(submitted)html+=explainBox(q,rec,result);html+=`<div class="qfooter"><div class="flex"><button class="btn" onclick="view.index=Math.max(view.index-1,0);renderQuiz()" ${i===0?'disabled':''}>→ قبلی</button><button class="btn" onclick="view.index=Math.min(view.index+1,${len-1});renderQuiz()" ${i===len-1?'disabled':''}>بعدی ←</button></div>${!submitted?`<button class="btn outline" onclick="submitQuiz()">پایان و تصحیح</button>`:`<button class="btn primary" onclick="showReport()">کارنامه و مرور</button>`}</div></div>`;return html}
function explainBox(q,rec,status){let explain=q.explanation||'',correctText=q.correct?`${q.correct}) ${q.options?.[LETTERS.indexOf(q.correct)]??''}`:'',wrongText=rec.choice?`${rec.choice}) ${q.options?.[LETTERS.indexOf(rec.choice)]??''}`:'پاسخی ثبت نشده';let shape=status==='correct'?'correct':status==='wrong'?'wrong':'';let short=typeOf(q)==='short';return `<div class="explain ${shape}"><b>${short?'پاسخ مرجع از متن فایل':'تصحیح و پاسخ تشریحی'}</b>${!short?`<p><strong>پاسخ درست:</strong> ${correctText?h(correctText):'در فایل کلید معتبر ندارد.'}</p>`:''}${status==='wrong'?`<div class="compare">❗ تو <b>${h(wrongText)}</b> را انتخاب کردی.<br>✅ <b>به‌جای آن به خاطر بسپار: ${h(correctText)}</b></div>`:''}${explain?`<div class="tip"><b>نکته و دلیل از فایل:</b><br>${h(explain)}</div>`:`<p class="muted">در فایل پاسخ تشریحی قابل اتکا برای این سؤال ارائه نشده است؛ از پاسخ قطعی خودداری می‌کنیم.</p>`}${q.status&&q.status!=='پاسخ از جزوه'?`<p class="dash">وضعیت پاسخ در منبع: ${h(q.status)}</p>`:''}${short?`<div class="flex"><span>مقایسه با پاسخ خودت:</span><button class="btn" onclick="selfMark('${q.uid}',true)">✓ درست گفته بودم</button><button class="btn bad" onclick="selfMark('${q.uid}',false)">نیاز به مرور دارم</button></div>`:''}</div>`}
function setChoice(uid,choice){let r=recState();if(r.submitted)return;r.answers[uid]={...(r.answers[uid]||{}),choice};store();let x=$('.qnav button.current');if(x)x.classList.add('filled');let qs=getQs(view.ch,view.topic);$('.progress i').style.width=`${qs.length?100*qs.filter(q=>r.answers[q.uid]?.choice||r.answers[q.uid]?.text).length/qs.length:0}%`}
function setText(uid,text){let r=recState();if(r.submitted)return;r.answers[uid]={...(r.answers[uid]||{}),text};store()}
function selfMark(uid,val){recState().answers[uid]={...(recState().answers[uid]||{}),self:val};store();renderQuiz()}
function submitQuiz(){let st=recState(),qs=getQs(view.ch,view.topic),empty=qs.filter(q=>!st.answers[q.uid]?.choice&&!st.answers[q.uid]?.text).length;if(!qs.length)return;if(!st.submitted&&empty&&!confirm(`${enfa(empty)} سؤال بدون پاسخ مانده است. آزمون را ثبت و تصحیح کنم؟`))return;st.submitted=true;st.at=Date.now();store();showReport()}
function restartQuiz(){if(!confirm('پاسخ‌ها و کارنامه این آزمون حذف شوند و از اول شروع کنی؟'))return;records[recKey()]={answers:{},submitted:false,at:0};store();view.index=0;view.onlyWrong=false;renderQuiz()}
function plain(s,n=290){return clean(s).slice(0,n)+(clean(s).length>n?'…':'')}
function reviewWrong(q,r){let isShort=typeOf(q)==='short';let right=q.correct?`${q.correct}) ${q.options[LETTERS.indexOf(q.correct)]}`:'پاسخ تشریحی فایل',chosen=isShort?plain(r.text||'ثبت نشده',90):r.choice?`${r.choice}) ${q.options[LETTERS.indexOf(r.choice)]}`:'بدون پاسخ';let detail=q.explanation?plain(q.explanation,850):'در فایل توضیح معتبری برای این سؤال درج نشده است.';return `<div class="review-item"><div class="qmeta"><span class="badge wrong">سؤال ${enfa(q.number)}</span><span class="badge">${h(q.topic)}</span><span class="badge">${h(q.year)}</span></div><b>${h(q.text)}</b><p>❌ انتخاب تو: <b>${h(chosen)}</b></p><p>✅ جواب درست: <b>${h(right)}</b></p><div class="cue"><b>حواست به این نکته باشد:</b> ${h(detail)}<br><br><b>تفاوتی که باید یادت بماند:</b> ${isShort?'پاسخ خودت را با پاسخ تشریحی مرجع مقایسه کن.':`«${h(chosen)}» انتخاب تو بود؛ پاسخ منبع «${h(right)}» است. این دو را هنگام مرور از هم تفکیک کن.`}</div></div>`}
function showReport(){goto('report',view.ch,view.topic);let qs=getQs(view.ch,view.topic),st=recState(),r=st.answers,sum=summarize(qs,r),wrongs=qs.filter(q=>resultFor(q,r[q.uid]||{})==='wrong'),missed=qs.filter(q=>resultFor(q,r[q.uid]||{})==='blank'),neutral=qs.filter(q=>resultFor(q,r[q.uid]||{})==='ungraded'),topicCounts=new Map();for(let q of qs){let k=q.topic||'عمومی',a=topicCounts.get(k)||{total:0,c:0,w:0};if(isGradeable(q)){a.total++;if(resultFor(q,r[q.uid]||{})==='correct')a.c++;else if(resultFor(q,r[q.uid]||{})==='wrong')a.w++}topicCounts.set(k,a)}let weak=[...topicCounts.entries()].filter(([_,a])=>a.w>0).sort((a,b)=>b[1].w-a[1].w);header('نتیجه آزمون',`کارنامه ${view.topic||CHAPTERS.find(x=>x.id===view.ch).name}`,`تاریخ ثبت: ${st.at?new Date(st.at).toLocaleString('fa-IR'):'هنوز آزمون ثبت نشده است'}`);
let score=sum.percent===null?'—':enfa(sum.percent)+'٪';let dashboard=`<div class="card"><div class="report-summary"><div class="score-ring" style="--pct:${sum.percent??0}%"><div><b>${score}</b><small>نمره تستی</small></div></div><div><h3>${sum.percent===null?'بدون سؤال قابل‌تصحیح':sum.percent>=85?'عملکرد عالی':sum.percent>=65?'عملکرد خوب؛ جای مرور دارد':sum.percent>=40?'برای تثبیت، مرور هدفمند لازم است':'پیشنهاد می‌شود مبحث را دوباره مرور کنی'}</h3><p class="muted">${enfa(sum.autoCorrect)} پاسخ درست از ${enfa(sum.graded)} تست دارای کلید معتبر • ${enfa(wrongs.length)} غلط • ${enfa(missed.length)} بی‌پاسخ</p><p class="dash">پاسخ‌های کوتاه و سؤال‌های بدون کلید، در نمره درصدی خودکار محاسبه نمی‌شوند. پاسخ‌های کوتاه را می‌توانی خودارزیابی کنی.</p></div></div><div class="flex" style="margin-top:20px"><button class="btn primary" onclick="showQuiz(${view.ch},${jsarg(view.topic)},0,true)">مرور فقط غلط‌ها</button><button class="btn" onclick="showQuiz(${view.ch},${jsarg(view.topic)})">همه سؤال‌ها با پاسخ تشریحی</button><button class="btn" onclick="exportReview()">دریافت متن مرور</button></div></div>`;
let weakPanel=`<div class="card"><h3>نقشه نقاط ضعف و اولویت مرور</h3>${weak.length?weak.map(([k,a])=>`<div class="review-item"><div class="flex" style="justify-content:space-between"><b>${h(k)}</b><span>${enfa(a.w)} غلط از ${enfa(a.total)} تست</span></div><div class="progress"><i style="width:${Math.round(100*a.c/a.total)}%"></i></div></div>`).join(''):'<p class="muted">در تست‌های تصحیح‌شده پاسخ غلطی برای تعیین نقطه‌ضعف ثبت نشده است.</p>'}</div>`;
let review=`<div class="card" id="review"><h3>🧠 مرور هوشمند اشتباه‌ها</h3><p class="muted">در هر سؤال، انتخابت کنار گزینه صحیح و توضیح همان سؤال در PDF آمده است؛ هرگز برای سؤال‌های بدون کلید پاسخ جعلی تولید نمی‌شود.</p>${wrongs.length?wrongs.map(q=>reviewWrong(q,r[q.uid]||{})).join(''):'<p class="notice good">برای این آزمون پاسخ غلط ثبت نشده است.</p>'}${missed.length?`<h3 style="margin-top:24px">سؤال‌های بی‌پاسخ (${enfa(missed.length)})</h3>`+missed.map(q=>`<div class="review-item"><b>سؤال ${enfa(q.number)}:</b> ${h(q.text)}<div class="cue">پاسخ: ${h(q.correct?`${q.correct}) ${q.options[LETTERS.indexOf(q.correct)]}`:'نامشخص')}<br>${h(plain(q.explanation,600))}</div></div>`).join(''):''}${neutral.length?`<div class="notice warn">${enfa(neutral.length)} سؤال فاقد کلید قطعی در نمره وارد نشده‌اند.</div>`:''}</div>`;
let completeAnswers=`<div class="card"><details><summary style="font-size:17px;font-weight:bold;cursor:pointer">📚 پاسخ‌نامه تشریحی کامل همه سؤال‌ها (${enfa(qs.length)} سؤال) — برای بازکردن بزن</summary><p class="muted">متن سؤال، پاسخ انتخابی، کلید و توضیح مرجع برای تمام سؤال‌های همین آزمون.</p>${qs.map(q=>{let a=r[q.uid]||{},ans=q.correct?`${q.correct}) ${q.options?.[LETTERS.indexOf(q.correct)]||''}`:'فاقد کلید تستی قابل‌تصحیح',selected=typeOf(q)==='mcq'?(a.choice?`${a.choice}) ${q.options?.[LETTERS.indexOf(a.choice)]||''}`:'بدون پاسخ'):(a.text||'بدون پاسخ'),status=resultFor(q,a);return `<div class="review-item"><div class="qmeta"><span class="badge">سؤال ${enfa(q.number)}</span><span class="badge">${h(q.topic)}</span><span class="badge ${status==='correct'?'correct':status==='wrong'?'wrong':'neutral'}">${status==='correct'?'درست':status==='wrong'?'نادرست':'بدون ارزیابی قطعی'}</span></div><p><b>${h(q.text)}</b></p>${typeOf(q)==='mcq'?q.options.map((o,i)=>`<p class="dash">${LETTERS[i]}) ${h(o)}</p>`).join(''):''}<p><b>پاسخ تو:</b> ${h(selected)}</p><p><b>کلید منبع:</b> ${h(ans)}</p><div class="cue">${h(q.explanation||'در فایل پاسخ تشریحی قطعی برای این سؤال ارائه نشده است.')}</div></div>`}).join('')}</details></div>`;
$('#mainContent').innerHTML=dashboard+weakPanel+review+completeAnswers+`<div class="flex"><button class="btn" onclick="showChapter(${view.ch})">بازگشت به فصل</button><button class="btn bad" onclick="restartFromReport()">آزمون مجدد از ابتدا</button></div>`}
function restartFromReport(){if(!confirm('آزمون از نو شروع شود؟ پاسخ‌ها و نمره قبلی این مجموعه پاک خواهد شد.'))return;records[recKey()]={answers:{},submitted:false,at:0};store();showQuiz(view.ch,view.topic)}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportReview(){let qs=getQs(view.ch,view.topic),r=recState().answers,wrong=qs.filter(q=>resultFor(q,r[q.uid]||{})==='wrong'),s=summarize(qs,r),parts=[`مرور هوشمند: ${view.topic||CHAPTERS.find(x=>x.id===view.ch).name}`,`نمره: ${s.percent===null?'بدون امتیاز خودکار':s.percent+'٪'}`,`درست: ${s.autoCorrect}/${s.graded} — غلط: ${wrong.length}`,`برگرفته از فایل بانک سؤالات میکروب‌شناسی`,`\n======================\n`];for(let q of wrong){let rec=r[q.uid]||{};parts.push(`سؤال ${q.number} / ${q.topic}\n${q.text}\nانتخاب من: ${q.options?.[LETTERS.indexOf(rec.choice)]||'بی‌پاسخ'}\nپاسخ صحیح: ${q.correct}) ${q.options[LETTERS.indexOf(q.correct)]}\nنکته مرور: ${q.explanation||'در فایل درج نشده است'}\n--------------------`)}download('مرور-اشتباهات-میکروب‌شناسی.txt',parts.join('\n'),'text/plain;charset=utf-8')}
function backup(){download('پشتیبان-آزمون-میکروب‌شناسی.json',JSON.stringify({version:3,records,bank,date:new Date().toISOString()},null,2),'application/json')}
async function restoreBackup(el){let f=el.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.records&&typeof obj.records==='object')records=obj.records;if(Array.isArray(obj.bank)&&obj.bank.length>bank.length)bank=obj.bank;store();showHome();toast('پیشرفت و سؤال‌ها بازیابی شدند.')}catch(e){toast('فایل پشتیبان معتبر نیست.','warn')}el.value=''}
function toggleSide(){$('#side').classList.toggle('open')}
function showImport(){goto('import');header('مدیریت سؤال‌ها','افزودن بانک سؤال از PDF','انتخاب PDF یک‌بار کافی است؛ داده استخراج‌شده برای استفاده بعدی در دستگاه ذخیره می‌شود.');$('#mainContent').innerHTML=`<div class="card"><h3>انتخاب فایل بانک سؤال</h3><p class="muted">این برنامه برای ساختار PDF «بانک سؤالات کلیات میکروب‌شناسی، جزوه‌های ۱ تا ۶» تنظیم شده است. ابتدا نیاز است کتابخانه نمایش PDF از اینترنت بارگذاری شود؛ پس از وارد کردن سؤال‌ها، آزمون بدون اینترنت هم کار می‌کند (مشروط به پایداری حافظه مرورگر).</p><div class="file-drop"><div style="font-size:35px">📄</div><b>فایل PDF اصلی را انتخاب کن</b><br><label class="btn primary" for="importPdf">انتخاب PDF و استخراج آزمون</label><input class="hidden" type="file" id="importPdf" accept="application/pdf,.pdf" onchange="importPdf(this)"><div id="importStatus" class="muted">لطفاً همان فایل ۱۸۰ صفحه‌ای را انتخاب کن.</div><div class="loading" style="margin:12px auto;max-width:460px"><i id="importBar"></i></div></div><div class="notice warn">در صورت دسترسی نداشتن به اینترنت یا خطای استخراج، از اسکریپت پایتون همراه فایل استفاده کن؛ خروجی آن HTML از پیش پرشده و کاملاً آفلاین است.</div></div>`}
async function loadPdfJS(){if(window.pdfjsLib)return;let src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';await new Promise((ok,fail)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('کتابخانه خواندن PDF بارگیری نشد؛ اینترنت یا فیلتر دسترسی را بررسی کن.'));document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
async function importPdf(el){let f=el.files?.[0];if(!f)return;const info=$('#importStatus'),bar=$('#importBar');try{info.textContent='در حال بارگذاری موتور استخراج PDF...';await loadPdfJS();info.textContent='در حال خواندن صفحات...';const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let pg=[];for(let n=1;n<=doc.numPages;n++){let p=await doc.getPage(n),tc=await p.getTextContent();let groups=[];for(let item of tc.items){if(!item.str?.trim())continue;let y=Math.round((item.transform?.[5]||0)*2)/2,x=item.transform?.[4]||0;let g=groups.find(v=>Math.abs(v.y-y)<2);if(!g){g={y,arr:[]};groups.push(g)}g.arr.push({x,t:item.str})}groups.sort((a,b)=>b.y-a.y);let txt=groups.map(g=>g.arr.sort((a,b)=>b.x-a.x).map(k=>k.t).join(' ').trim()).filter(Boolean).join('\n');pg.push({page:n,text:txt});if(n%2===0||n===doc.numPages){info.textContent=`صفحه ${enfa(n)} از ${enfa(doc.numPages)} خوانده شد...`;bar.style.width=Math.round(100*n/doc.numPages)+'%';await new Promise(r=>setTimeout(r,0))}}let parsed=parsePages(pg);if(!parsed.length)throw new Error('سؤالی استخراج نشد. پیشنهاد: خروجی اسکریپت پایتون را به کار ببر.');bank=parsed;store();toast(`${enfa(parsed.length)} سؤال استخراج شد؛ ${parsed.length===385?'استخراج کامل به نظر می‌رسد.':'توجه: تعداد سؤال‌های استخراجی با ۳۸۵ سؤال منبع برابر نیست!'} چند سؤال و جواب را با PDF تطبیق بده.`,parsed.length===385?'good':'warn');showHome()}catch(e){console.error(e);info.textContent='خطا: '+e.message;toast('استخراج PDF ناموفق بود؛ از روش آفلاین پایتون استفاده کن.','warn')}el.value=''}
function parsePages(pages){let list=[];for(let ch of CHAPTERS){let joined=pages.filter(p=>p.page>=ch.start&&p.page<=ch.end).map(p=>`\n\n##PAGE_${p.page}\n`+clean(p.text)).join('\n');let res=parseChapter(joined,ch.id);list.push(...res)}return list}
function parseChapter(input,ch){let lines=clean(input).split('\n').map(x=>x.trim()).filter(Boolean),questions=[],answers={},mode='q',current=null,ans=null,keyText=[],skipQuestionTail=false,skipAnswerSource=false;function finalizeQ(){if(current&&current.text)questions.push(current);current=null}function finalizeA(){if(ans){let full=clean(ans.lines.join(' ')),m=full.match(/(?:^|\s)پاسخ\s*[:：]\s*(الف|ب|ج|د)\s*[)\-:]/);if(m)ans.correct=m[1];let status=clean(ans.status||'');let e=full.replace(/منبع پاسخ\s*[:：].*$/,'').trim();answers[ans.num]={correct:ans.correct||null,explanation:e,status};ans=null}}for(let line of lines){if(/^##PAGE_\d+/.test(line))continue;if(/^آبان\s*(MEDORA|\|)/.test(line)||/^MEDORA\s*[|]/.test(line)||/^\d+$/.test(line))continue;if(/پاسخنامه\s*(کلیدی|لکیدی)/.test(line)){finalizeQ();mode='key';continue}if(/پاسخ\s*(تشریحی|ترشیحی)/.test(line)&&line.length<35){finalizeQ();mode='answer';continue}if(/^منبع سؤال\s*[:：]/.test(line)||/^یادداشت استخراج\s*[:：]/.test(line)){skipQuestionTail=true;continue}if(/^منبع پاسخ\s*[:：]/.test(line)){skipAnswerSource=true;continue}
let questionHeader=line.match(/^سؤال\s*[-—–]?\s*(\d+)\s*سال/);if(questionHeader&&mode!=='answer'){finalizeQ();mode='q';skipQuestionTail=false;let num=+questionHeader[1],year=(line.match(/سال\s*[-—–]?\s*(\d{4})/)||[])[1]||'',code=(line.match(/\bX\d{2}[-–]?[TE]\d{2}\b/i)||[])[0]||'',topic=(line.match(/مبحث\s*[:：]\s*(.*)/)||[])[1]||'عمومی';topic=topic.replace(/\bX\d{2}[-–]?[TE]\d{2}\b/ig,'').replace(/[-—–]+$/,'').trim()||'عمومی';current={uid:`c${ch}q${num}`,chapter:ch,number:num,year,code,topic,text:'',options:[],correct:null,explanation:'',status:ch===7?'در جزوه پاسخ قطعی ندارد':''};continue}
let am=line.match(/^سؤال\s*(\d+)\s*(.+)/);if(mode==='answer'&&am){finalizeA();skipAnswerSource=false;ans={num:+am[1],status:(am[2].split(/پاسخ\s*[:：]/)[0]||'').trim(),correct:(am[2].match(/پاسخ\s*[:：]\s*(الف|ب|ج|د)\s*[).:]/)||[])[1]||null,lines:[am[2].replace(/^.*?پاسخ\s*[:：]\s*(?:الف|ب|ج|د)\s*[).:]\s*/,'')]};continue}
if(mode==='answer'&&ans){if(!skipAnswerSource)ans.lines.push(line);continue}if(mode==='key'){keyText.push(line);continue}if(mode==='q'&&current&&!skipQuestionTail){let opt=line.match(/^(الف|ب|ج|د|ه|و)\s*[).]\s*(.*)$/);if(opt){current.options.push(opt[2]);continue}if(/^منبع|^یادداشت/.test(line))continue;if(current.options.length)current.options[current.options.length-1]+=' '+line;else current.text+=(current.text?' ':'')+line}}
finalizeQ();finalizeA();let k=keyText.join(' ');let map={};let reg=/(?:\b|\s)(\d+)\s*[)\]]\s*(الف|ب|ج|د|تشریحی)/g,m;while((m=reg.exec(k))!==null)map[+m[1]]=m[2];for(let q of questions){let a=answers[q.number];if(a){q.correct=a.correct||null;q.explanation=a.explanation;q.status=a.status||q.status}if(!q.correct&&map[q.number]&&map[q.number]!=='تشریحی')q.correct=map[q.number];if(ch===7)q.correct=null;if(q.options.length<2)q.correct=null;q.text=clean(q.text);q.options=q.options.map(clean);q.topic=clean(q.topic);q.explanation=clean(q.explanation)}return questions.filter(q=>q.text)}
showHome();
